[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "ehkscci-bench"
version = "0.1.3"
description = "Exploratory geometrico-spectral graph benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Mohamed Nour Kayad" },
]
keywords = ["graph theory", "Ollivier-Ricci curvature", "spectral graph theory", "benchmark"]
dependencies = ["numpy>=1.23", "scipy>=1.10", "pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ehkscci = "ehkscci.cli:main"

[project.urls]
Repository = "https://github.com/Pr-Nour-kayad-Mohamed/ehkscci-bench"
Issues = "https://github.com/Pr-Nour-kayad-Mohamed/ehkscci-bench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
